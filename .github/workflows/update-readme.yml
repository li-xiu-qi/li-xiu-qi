name: Update README with Top Starred Repos

on:
  schedule:
    - cron: "0 16 * * *"  # 每天 00:00 (UTC+8) 运行一次

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // 获取所有 owned repos 并按 star 数排序
            let allRepos = [];
            let page = 1;
            const perPage = 100;
            while (true) {
              const { data: repos } = await github.rest.repos.listForUser({
                username: context.repo.owner,
                type: 'owner',
                per_page: perPage,
                page: page
              });
              allRepos = allRepos.concat(repos);
              if (repos.length < perPage) break;
              page++;
            }
            const repos = allRepos.sort((a, b) => b.stargazers_count - a.stargazers_count).slice(0, 10);

            let repoList = '## 🌟 Top Starred Repositories\n\n';
            repoList += '| Repository | Description | Stars |\n';
            repoList += '|------------|-------------|-------|\n';
            repos.forEach(repo => {
              const desc = repo.description || 'No description';
              repoList += `| [${repo.name}](${repo.html_url}) | ${desc} | ${repo.stargazers_count} |\n`;
            });

            // 读取当前README
            const readmePath = 'README.md';
            let readmeContent = '';
            let readmeData;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath
              });
              readmeData = data;
              readmeContent = Buffer.from(data.content, 'base64').toString('utf-8');
            } catch (error) {
              console.log('README not found, will create a new one');
            }

            // 拼出写入后的完整内容
            const placeholder = '<!-- TOP-REPOS-LIST -->';
            const sectionRegex = /## 🌟 Top Starred Repositories[\s\S]*?<!-- TOP-REPOS-LIST -->/;
            let newContent;
            if (sectionRegex.test(readmeContent)) {
              newContent = readmeContent.replace(sectionRegex, repoList + '\n' + placeholder);
            } else if (readmeContent.includes(placeholder)) {
              // 占位符在但缺区块标题：在占位符前插入新区块
              newContent = readmeContent.replace(placeholder, repoList + '\n' + placeholder);
            } else {
              newContent = readmeContent + '\n' + repoList;
            }

            // 幂等检查：内容没变化就不写，避免产生空提交
            if (newContent === readmeContent) {
              console.log('Top starred repos list unchanged, skipping write.');
            } else {
              console.log('Top starred repos list changed, updating README.');
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath,
                message: 'Update top starred repos list',
                content: Buffer.from(newContent).toString('base64'),
                sha: readmeData ? readmeData.sha : undefined
              });
            }
