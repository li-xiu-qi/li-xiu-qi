name: Update README with Top Starred Repos

on:
  push:
  schedule:
    - cron: "0 */1 * * *"  # 每小时运行一次

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            // 获取所有 owned repos 并按 star 数排序
            let allRepos = [];
            let page = 1;
            const perPage = 100;
            while (true) {
              const { data: repos } = await github.rest.repos.listForUser({
                username: context.repo.owner,
                type: 'owner',
                per_page: perPage,
                page: page
              });
              allRepos = allRepos.concat(repos);
              if (repos.length < perPage) break;
              page++;
            }
            const repos = allRepos.sort((a, b) => b.stargazers_count - a.stargazers_count).slice(0, 10);

            let repoList = '## 🌟 Top Starred Repositories\n\n';
            repoList += '| Repository | Description | Stars |\n';
            repoList += '|------------|-------------|-------|\n';
            repos.forEach(repo => {
              const desc = repo.description || 'No description';
              repoList += `| [${repo.name}](${repo.html_url}) | ${desc} | ${repo.stargazers_count} |\n`;
            });

            // 读取当前README
            const readmePath = 'README.md';
            let readmeContent = '';
            let readmeData;
            try {
              const { data: data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: readmePath
              });
              readmeData = data;
              readmeContent = Buffer.from(readmeData.content, 'base64').toString('utf-8');
            } catch (error) {
              console.log('README not found, creating new one');
            }

            // 替换或添加列表（假设有占位符<!-- TOP-REPOS-LIST -->）
            const placeholder = '<!-- TOP-REPOS-LIST -->';
            if (readmeContent.includes(placeholder)) {
              readmeContent = readmeContent.replace(placeholder, repoList + '\n' + placeholder);
            } else {
              readmeContent += '\n' + repoList;
            }

            // 写入新README
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: readmePath,
              message: 'Update top starred repos list',
              content: Buffer.from(readmeContent).toString('base64'),
              sha: readmeData ? readmeData.sha : undefined
            });

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update README with top starred repos
          branch: main